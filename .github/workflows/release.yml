name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for pending changesets
        id: changesets
        run: |
          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          echo "Found ${CHANGESET_COUNT} changeset(s)"
          echo "count=${CHANGESET_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Version and Release
        if: steps.changesets.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Run changeset version to consume changesets and bump package.json / CHANGELOG.md
          bun run changeset version

          # 2. Extract new version from package.json
          NEW_VERSION=$(jq -r .version package.json)
          TAG_NAME="v${NEW_VERSION}"
          echo "🚀 Preparing release for ${TAG_NAME}"

          # 3. Extract release notes for this specific version from CHANGELOG.md
          bun -e '
            import fs from "node:fs";
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const version = "'"${NEW_VERSION}"'".replaceAll(".", "\\.");
            const regex = new RegExp(`## \\\\b${version}\\\\b[\\\\s\\\\S]*?(?=\\\\n## |$)`);
            const match = content.match(regex);
            const notes = match ? match[0].replace(new RegExp(`^## \\\\b${version}\\\\b`), "").trim() : `Release ${version}`;
            fs.writeFileSync("RELEASE_NOTES.md", notes);
          '

          # 4. Configure Git credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 5. Commit, tag, and push release
          git add -A
          git commit -m "chore(release): ${TAG_NAME} [skip ci]"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"

          echo "📤 Pushing release commit and tag to main..."
          git push origin main --follow-tags

          # 6. Create GitHub Release
          echo "🎉 Publishing GitHub Release for ${TAG_NAME}..."
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
