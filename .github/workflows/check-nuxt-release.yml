name: Nuxt Release Watcher

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: Force a specific Nuxt version (e.g. 4.7.0). Leave empty to check latest release.
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run mode (check & log actions without pushing or opening PR)"
        required: false
        default: false
        type: boolean

concurrency:
  group: nuxt-release-watcher
  cancel-in-progress: false

jobs:
  check-nuxt-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check Nuxt release & Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_FORCE_VERSION: ${{ inputs.force_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ./.github/scripts/check-nuxt-release.sh
