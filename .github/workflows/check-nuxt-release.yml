name: Nuxt Release Watcher

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: Force a specific Nuxt version (e.g. 4.6.5). Leave empty to use latest on npm.
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run mode (check & log actions without pushing or opening PR)"
        required: false
        default: false
        type: boolean

concurrency:
  group: nuxt-release-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-nuxt-release:
    # Scheduled workflows always use the default branch; block accidental fork runs.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        # Pinned to v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Optional PAT with repo + pull_request (contents) scopes so PRs trigger CI.
          # When unset, github.token is used (PRs may not re-run workflows until merge).
          token: ${{ secrets.PAT_TOKEN || github.token }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync default branch from origin
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}" --prune
          git checkout "${{ github.event.repository.default_branch }}"
          git reset --hard "origin/${{ github.event.repository.default_branch }}"

      - name: Setup Node
        # Pinned to v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        # Pinned to v2.0.1
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - name: Check Nuxt release & Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          INPUT_FORCE_VERSION: ${{ inputs.force_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod +x ./.github/scripts/check-nuxt-release.sh
          ./.github/scripts/check-nuxt-release.sh
