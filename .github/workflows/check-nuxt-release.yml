name: Nuxt Release Watcher

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: Force a specific Nuxt version (e.g. 4.7.0). Leave empty to check latest release.
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run mode (check & log actions without pushing or opening PR)"
        required: false
        default: false
        type: boolean

concurrency:
  group: nuxt-release-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-nuxt-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        # Pinned to v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # PAT_TOKEN is used so that created PRs can trigger other workflows (e.g. CI checks),
          # as actions triggered by GITHUB_TOKEN do not spawn downstream workflow runs.
          # Falls back to GITHUB_TOKEN when PAT_TOKEN is not configured.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        # Pinned to v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: .node-version

      - name: Setup Bun
        # Pinned to v2.0.1
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - name: Check Nuxt release & Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_FORCE_VERSION: ${{ inputs.force_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ./.github/scripts/check-nuxt-release.sh
